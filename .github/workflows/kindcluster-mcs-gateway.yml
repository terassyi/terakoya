# kindcluster/mcs-gateway static checks (kindcluster/mcs-gateway/docs/testing.md 4.2)
name: kindcluster/mcs-gateway
on:
  pull_request:
    paths:
      - "kindcluster/mcs-gateway/**"
      - ".github/workflows/kindcluster-mcs-gateway.yml"
  push:
    branches:
      - main
    paths:
      - "kindcluster/mcs-gateway/**"
      - ".github/workflows/kindcluster-mcs-gateway.yml"

env:
  # Keep in sync with Taskfile.yaml (D2_VERSION) and docs/operations.md 2.2.
  D2_VERSION: v0.9.0
  D2_SHA256: 5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9

jobs:
  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kindcluster/mcs-gateway
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: kindcluster/mcs-gateway/e2e/go.mod
          cache-dependency-path: kindcluster/mcs-gateway/e2e/go.sum
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.1
          aqua_opts: ""
          working_directory: kindcluster/mcs-gateway
      - name: Install d2
        run: |
          tarball="d2-${D2_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/d2lang/d2/releases/download/${D2_VERSION}/${tarball}"
          echo "${D2_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/d2"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/d2" --strip-components=1
          echo "$RUNNER_TEMP/d2/bin" >> "$GITHUB_PATH"
          rm "$tarball"
      - run: task lint
