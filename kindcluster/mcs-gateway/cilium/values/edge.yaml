# Cilium values for cluster edge (docs/cilium.md 2.3).
cluster:
  name: edge
  id: 1
# Resolved by the docker DNS to the eth0 address of the control-plane.
k8sServiceHost: edge-control-plane
k8sServicePort: 6443
# The Pods of this cluster (default and routable pools). No SNAT inside; traffic leaving the
# cluster from the default pool is SNATed to node0 (docs/cilium.md 2.3).
ipv4NativeRoutingCIDR: 10.100.0.0/16
