# Cilium values shared by all clusters (docs/cilium.md 2.2).
kubeProxyReplacement: true
routingMode: native
autoDirectNodeRoutes: true
# No SNAT inside the cluster address space (nodes, LB VIPs, Pods, Services of all clusters).
# Fabric devices (10.255.0.0/16, e.g. dns0) are outside, so they see node0 addresses.
ipv4NativeRoutingCIDR: 10.64.0.0/10
# eth0 (docker "kind" network) only reaches the API server; keep it out.
devices: node0
bpf:
  # multi-pool IPAM needs egressMasqueradeInterfaces with iptables masquerade.
  masquerade: true
ipam:
  mode: multi-pool
operator:
  replicas: 1
# Do not compete with Envoy Gateway.
gatewayAPI:
  enabled: false
