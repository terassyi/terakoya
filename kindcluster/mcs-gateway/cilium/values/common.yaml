# Cilium values shared by all clusters (docs/cilium.md 2.2).
kubeProxyReplacement: true
routingMode: native
autoDirectNodeRoutes: true
# eth0 (docker "kind" network) only reaches the API server; keep it out.
devices: node0
bpf:
  # multi-pool IPAM needs egressMasqueradeInterfaces with iptables masquerade.
  masquerade: true
ipam:
  mode: multi-pool
# Advertise the routable pool and LB VIPs to the ToR (docs/cilium.md 4).
bgpControlPlane:
  enabled: true
# Restart the agents and the operator when cilium-config changes; a no-op upgrade restarts nothing.
rollOutCiliumPods: true
operator:
  replicas: 1
  rollOutPods: true
# DSR with the Geneve dispatch and Maglev (docs/cilium.md 5). Routing stays native; the geneve
# dispatch needs tunnelProtocol geneve. pmtuDiscovery stays off: packets that grow over the node0
# MTU are fragmented in the outer IP header (docs/cilium.md 5.3).
tunnelProtocol: geneve
loadBalancer:
  mode: dsr
  dsrDispatch: geneve
  algorithm: maglev
# Do not compete with Envoy Gateway.
gatewayAPI:
  enabled: false
