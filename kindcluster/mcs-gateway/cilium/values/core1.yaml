# Cilium values for cluster core1 (docs/cilium.md 2.3).
cluster:
  name: core1
  id: 2
# Resolved by the docker DNS to the eth0 address of the control-plane.
k8sServiceHost: core1-control-plane
k8sServicePort: 6443
# The Pods of this cluster (default and routable pools). No SNAT inside; traffic leaving the
# cluster from the default pool is SNATed to node0 (docs/cilium.md 2.3).
ipv4NativeRoutingCIDR: 10.101.0.0/16
# The same on all nodes of the cluster: base64 of 12 bytes ("mcsgw-core11") (docs/cilium.md 5.2).
maglev:
  hashSeed: bWNzZ3ctY29yZTEx
