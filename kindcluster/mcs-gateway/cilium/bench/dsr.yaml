# iperf3 server for task bench-dsr on cluster edge (docs/cilium.md 5.4).
# The server is on edge-worker2; the receiving node is pinned on tor-edge (docs/cilium.md 5.5).
apiVersion: v1
kind: Namespace
metadata:
  name: dsr-bench
---
apiVersion: v1
kind: Pod
metadata:
  name: iperf3
  namespace: dsr-bench
  labels:
    app: iperf3
spec:
  nodeName: edge-worker2
  containers:
    - name: iperf3
      image: nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
      command: ["iperf3", "-s"]
      # No readiness probe: iperf3 -s serves one client at a time, and a probe would disturb a run.
      ports:
        - containerPort: 5201
---
apiVersion: v1
kind: Service
metadata:
  name: iperf3
  namespace: dsr-bench
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: iperf3
  ports:
    - port: 5201
      targetPort: 5201
