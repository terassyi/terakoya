# mcs-gateway fabric (docs/network.md). Deploy with `task deploy-fabric`.
# Images are pinned here, not passed from Taskfile, because sudo drops the environment (docs/operations.md 2).
name: mcsgw

topology:
  nodes:
    # --- cluster edge (10.69.0.0/24) ---
    edge:
      kind: k8s-kind
      image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
      startup-config: kind/edge.kind.yaml
      # No CNI yet, so nodes never become Ready; do not wait (default 15m).
      wait: 0s
      # Relative to the node's lab dir: clab-mcsgw/<cluster>/kubeconfig. Keeps root's ~/.kube/config untouched.
      kubeconfig: kubeconfig
    edge-control-plane:
      kind: ext-container
    edge-worker:
      kind: ext-container
    edge-worker2:
      kind: ext-container
    sc-edge-control-plane:
      kind: linux
      image: nicolaka/netshoot:v0.16
      network-mode: container:edge-control-plane
      cmd: sleep infinity
      exec:
        - ip addr replace 10.69.0.11/24 dev node0
        - ip route replace default via 10.69.0.1 dev node0
    sc-edge-worker:
      kind: linux
      image: nicolaka/netshoot:v0.16
      network-mode: container:edge-worker
      cmd: sleep infinity
      exec:
        - ip addr replace 10.69.0.12/24 dev node0
        - ip route replace default via 10.69.0.1 dev node0
    sc-edge-worker2:
      kind: linux
      image: nicolaka/netshoot:v0.16
      network-mode: container:edge-worker2
      cmd: sleep infinity
      exec:
        - ip addr replace 10.69.0.13/24 dev node0
        - ip route replace default via 10.69.0.1 dev node0

    # --- cluster core1 (10.69.1.0/24) ---
    core1:
      kind: k8s-kind
      image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
      startup-config: kind/core1.kind.yaml
      # No CNI yet, so nodes never become Ready; do not wait (default 15m).
      wait: 0s
      # Relative to the node's lab dir: clab-mcsgw/<cluster>/kubeconfig. Keeps root's ~/.kube/config untouched.
      kubeconfig: kubeconfig
    core1-control-plane:
      kind: ext-container
    core1-worker:
      kind: ext-container
    core1-worker2:
      kind: ext-container
    sc-core1-control-plane:
      kind: linux
      image: nicolaka/netshoot:v0.16
      network-mode: container:core1-control-plane
      cmd: sleep infinity
      exec:
        - ip addr replace 10.69.1.11/24 dev node0
        - ip route replace default via 10.69.1.1 dev node0
    sc-core1-worker:
      kind: linux
      image: nicolaka/netshoot:v0.16
      network-mode: container:core1-worker
      cmd: sleep infinity
      exec:
        - ip addr replace 10.69.1.12/24 dev node0
        - ip route replace default via 10.69.1.1 dev node0
    sc-core1-worker2:
      kind: linux
      image: nicolaka/netshoot:v0.16
      network-mode: container:core1-worker2
      cmd: sleep infinity
      exec:
        - ip addr replace 10.69.1.13/24 dev node0
        - ip route replace default via 10.69.1.1 dev node0

    # --- cluster core2 (10.69.2.0/24) ---
    core2:
      kind: k8s-kind
      image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
      startup-config: kind/core2.kind.yaml
      # No CNI yet, so nodes never become Ready; do not wait (default 15m).
      wait: 0s
      # Relative to the node's lab dir: clab-mcsgw/<cluster>/kubeconfig. Keeps root's ~/.kube/config untouched.
      kubeconfig: kubeconfig
    core2-control-plane:
      kind: ext-container
    core2-worker:
      kind: ext-container
    core2-worker2:
      kind: ext-container
    sc-core2-control-plane:
      kind: linux
      image: nicolaka/netshoot:v0.16
      network-mode: container:core2-control-plane
      cmd: sleep infinity
      exec:
        - ip addr replace 10.69.2.11/24 dev node0
        - ip route replace default via 10.69.2.1 dev node0
    sc-core2-worker:
      kind: linux
      image: nicolaka/netshoot:v0.16
      network-mode: container:core2-worker
      cmd: sleep infinity
      exec:
        - ip addr replace 10.69.2.12/24 dev node0
        - ip route replace default via 10.69.2.1 dev node0
    sc-core2-worker2:
      kind: linux
      image: nicolaka/netshoot:v0.16
      network-mode: container:core2-worker2
      cmd: sleep infinity
      exec:
        - ip addr replace 10.69.2.13/24 dev node0
        - ip route replace default via 10.69.2.1 dev node0

    # --- routers ---
    spine0:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
        - frr/spine0.conf:/etc/frr/frr.conf:ro
      exec:
        - ip addr replace 10.255.0.0/31 dev tor-edge
        - ip addr replace 10.255.0.2/31 dev tor-core1
        - ip addr replace 10.255.0.4/31 dev tor-core2
        - ip addr replace 172.30.0.2/30 dev host0
        - ip addr replace 10.255.0.6/31 dev dns0
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1
    # iptables for spine0 (the FRR image has none); shares spine0's netns.
    nat-spine0:
      kind: linux
      image: nicolaka/netshoot:v0.16
      network-mode: container:spine0
      cmd: sleep infinity
      exec:
        - sh -c 'iptables -t nat -C POSTROUTING -s 10.69.0.0/16 -o eth0 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 10.69.0.0/16 -o eth0 -j MASQUERADE'
    tor-edge:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
        - frr/tor-edge.conf:/etc/frr/frr.conf:ro
      exec:
        - ip link add br0 type bridge
        - ip addr add 10.69.0.1/24 dev br0
        - ip link set br0 mtu 1500
        - ip link set br0 up
        - ip link set n0 master br0
        - ip link set n1 master br0
        - ip link set n2 master br0
        - ip addr add 10.255.0.1/31 dev uplink
        - ip route replace default via 10.255.0.0 dev uplink
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1
    tor-core1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
        - frr/tor-core1.conf:/etc/frr/frr.conf:ro
      exec:
        - ip link add br0 type bridge
        - ip addr add 10.69.1.1/24 dev br0
        - ip link set br0 mtu 1500
        - ip link set br0 up
        - ip link set n0 master br0
        - ip link set n1 master br0
        - ip link set n2 master br0
        - ip addr add 10.255.0.3/31 dev uplink
        - ip route replace default via 10.255.0.2 dev uplink
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1
    tor-core2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/vtysh.conf:/etc/frr/vtysh.conf:ro
        - frr/tor-core2.conf:/etc/frr/frr.conf:ro
      exec:
        - ip link add br0 type bridge
        - ip addr add 10.69.2.1/24 dev br0
        - ip link set br0 mtu 1500
        - ip link set br0 up
        - ip link set n0 master br0
        - ip link set n1 master br0
        - ip link set n2 master br0
        - ip addr add 10.255.0.5/31 dev uplink
        - ip route replace default via 10.255.0.4 dev uplink
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv4.fib_multipath_hash_policy=1

    # --- DNS resolver of the fabric (docs/network.md 2.8) ---
    # Same CoreDNS image as kindest/node. Upstream is docker's DNS via eth0 (mgmt).
    dns0:
      kind: linux
      image: registry.k8s.io/coredns/coredns:v1.14.2
      binds:
        - dns/Corefile:/etc/coredns/Corefile:ro
      cmd: -conf /etc/coredns/Corefile
    # The CoreDNS image has no ip command; the sidecar holds the link and sets the address.
    sc-dns0:
      kind: linux
      image: nicolaka/netshoot:v0.16
      network-mode: container:dns0
      cmd: sleep infinity
      exec:
        - ip addr replace 10.255.0.7/31 dev uplink
        # Only the nodes go to spine0; the default route stays on eth0.
        - ip route replace 10.69.0.0/16 via 10.255.0.6 dev uplink

    # --- host side of host0 (docs/network.md 2.5) ---
    # Runs in the host netns (containerlab linux nodes are privileged), so the host
    # address and routes are set without `sudo ip`. They go away with to-mcsgw on destroy.
    host-mcsgw:
      kind: linux
      image: nicolaka/netshoot:v0.16
      network-mode: host
      cmd: sleep infinity
      exec:
        - sh -c 'for i in $(seq 60); do ip link show to-mcsgw >/dev/null 2>&1 && exit 0; sleep 1; done; echo to-mcsgw not found >&2; exit 1'
        - ip addr replace 172.30.0.1/30 dev to-mcsgw
        - ip route replace 10.69.0.0/16 via 172.30.0.2 dev to-mcsgw
        - ip route replace 10.80.0.0/14 via 172.30.0.2 dev to-mcsgw

  # All links use MTU 1500 instead of containerlab's 9500 (docs/network.md 2.6).
  links:
    - endpoints: ["spine0:tor-edge", "tor-edge:uplink"]
      mtu: 1500
    - endpoints: ["spine0:tor-core1", "tor-core1:uplink"]
      mtu: 1500
    - endpoints: ["spine0:tor-core2", "tor-core2:uplink"]
      mtu: 1500
    - endpoints: ["tor-edge:n0", "sc-edge-control-plane:node0"]
      mtu: 1500
    - endpoints: ["tor-edge:n1", "sc-edge-worker:node0"]
      mtu: 1500
    - endpoints: ["tor-edge:n2", "sc-edge-worker2:node0"]
      mtu: 1500
    - endpoints: ["tor-core1:n0", "sc-core1-control-plane:node0"]
      mtu: 1500
    - endpoints: ["tor-core1:n1", "sc-core1-worker:node0"]
      mtu: 1500
    - endpoints: ["tor-core1:n2", "sc-core1-worker2:node0"]
      mtu: 1500
    - endpoints: ["tor-core2:n0", "sc-core2-control-plane:node0"]
      mtu: 1500
    - endpoints: ["tor-core2:n1", "sc-core2-worker:node0"]
      mtu: 1500
    - endpoints: ["tor-core2:n2", "sc-core2-worker2:node0"]
      mtu: 1500
    - endpoints: ["spine0:dns0", "sc-dns0:uplink"]
      mtu: 1500
    - endpoints: ["spine0:host0", "host:to-mcsgw"]
      mtu: 1500
