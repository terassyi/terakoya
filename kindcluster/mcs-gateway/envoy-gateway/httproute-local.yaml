# Route to the echo in edge (docs/envoy-gateway.md 2.1).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-local
  namespace: demo
spec:
  parentRefs:
    - name: gw
  hostnames: ["echo-local.mcs.example"]
  rules:
    - backendRefs:
        - name: echo
          port: 8080
