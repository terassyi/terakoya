! spine0 (docs/network.md 2.3)
frr defaults datacenter
hostname spine0
!
router bgp 65000
 bgp router-id 10.255.0.0
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor TOR peer-group
 neighbor TOR remote-as external
 neighbor 10.255.0.1 peer-group TOR
 neighbor 10.255.0.3 peer-group TOR
 neighbor 10.255.0.5 peer-group TOR
 !
 address-family ipv4 unicast
  maximum-paths 8
 exit-address-family
exit
