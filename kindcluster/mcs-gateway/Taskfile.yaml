# mcs-gateway lab. Tasks are documented in docs/operations.md (3) and docs/testing.md.
version: "3"

vars:
  # Versions not managed by aqua (docs/operations.md 2).
  YAMLLINT_VERSION: 1.38.0
  CILIUM_VERSION: 1.20.4
  # A chart URL, not "cilium --repo": helm would take the local cilium/ directory as the chart.
  CILIUM_CHART: https://helm.cilium.io/cilium-{{.CILIUM_VERSION}}.tgz
  ENVOY_GATEWAY_VERSION: v1.9.3
  ENVOY_GATEWAY_CHART: oci://docker.io/envoyproxy/gateway-helm
  # CRDs whose schemas lint:kubeconform builds, relative to the CRD directory of the chart.
  ENVOY_GATEWAY_CRDS: >-
    gatewayapi-crds.yaml
    generated/gateway.envoyproxy.io_envoyproxies.yaml
  # CRDs whose schemas lint:kubeconform builds, relative to the CRD directory of the tag (docs/testing.md 4.1).
  CILIUM_CRDS: >-
    v2alpha1/ciliumpodippools.yaml
    v2/ciliumbgpclusterconfigs.yaml
    v2/ciliumbgppeerconfigs.yaml
    v2/ciliumbgpadvertisements.yaml
    v2/ciliumloadbalancerippools.yaml
  KUBECONFORM_CACHE: .cache/kubeconform
  D2_FLAGS: --layout elk --theme 0 --pad 24
  # Commands that must be on PATH (docs/operations.md 1, item 8).
  # HOST_COMMANDS come from the host. AQUA_COMMANDS maps every package in
  # aqua.yaml to its commands; `task lint:tools` keeps the keys in sync.
  HOST_COMMANDS: docker curl go
  AQUA_COMMANDS:
    map:
      kubernetes-sigs/kind: kind
      srl-labs/containerlab: containerlab
      kubernetes/kubectl: kubectl
      helm/helm: helm
      kubernetes-sigs/kustomize: kustomize
      go-task/task: task
      mikefarah/yq: yq
      jqlang/jq: jq
      cilium/cilium-cli: cilium
      yannh/kubeconform: kubeconform
      lycheeverse/lychee: lychee
      astral-sh/uv: uv uvx
      suzuki-shunsuke/pinact: pinact
      d2lang/d2: d2
      rhysd/actionlint: actionlint
      koalaman/shellcheck: shellcheck
  # Test label -> top-level test function (docs/testing.md 3.2).
  TEST_FUNCS:
    map:
      fabric: TestFabric
      cilium: TestCilium
      bgp: TestBGP
      gateway: TestGateway
      mcs: TestMCS
      multicluster-gateway: TestMulticlusterGateway
  # Test IDs checked by the reproducibility procedure, not by Go tests (docs/testing.md 4.1).
  REPRO_TEST_IDS: fabric-10 fabric-11
  CLUSTERS: edge core1 core2
  # sudo's secure_path does not include the aqua shims (docs/network.md 2.7).
  CLAB:
    sh: echo "sudo $(aqua which containerlab)"

tasks:
  setup:
    desc: Install the lab tools with aqua
    cmds:
      - aqua install

  check-host:
    desc: Check the host prerequisites (read only)
    silent: true
    cmds:
      - cmd: |
          set -u
          fail=0
          ng() { echo "NG   $1"; echo "     -> $2"; fail=1; }
          warn() { echo "WARN $1"; }
          ok() { echo "OK   $1"; }

          # 1. OS
          if [ "$(uname -s)" = Linux ] && ! grep -qi microsoft /proc/version; then
            ok "OS: Linux"
          else
            ng "OS: $(uname -s) (WSL2 and macOS are not supported)" "use a Linux host where Docker runs natively"
          fi

          # 2. CPU / 3. memory (guideline only)
          cpus=$(nproc)
          if [ "$cpus" -ge 8 ]; then ok "CPU: $cpus"; else warn "CPU: $cpus (8 or more recommended)"; fi
          mem_gb=$(awk '/^MemTotal:/ {printf "%d", $2/1024/1024}' /proc/meminfo)
          if [ "$mem_gb" -ge 24 ]; then ok "memory: ${mem_gb}GB"; else warn "memory: ${mem_gb}GB (24GB or more recommended)"; fi

          # 4. Docker storage driver ("overlayfs" means the containerd snapshotter is enabled)
          driver=$(docker info --format '{{"{{"}}.Driver{{"}}"}}' 2>/dev/null || echo "unavailable")
          if [ "$driver" = overlay2 ]; then
            ok "docker storage driver: overlay2"
          else
            ng "docker storage driver: $driver" "use overlay2; on Docker 29+ set \"features\": {\"containerd-snapshotter\": false} in /etc/docker/daemon.json"
          fi

          # 5. sysctl
          for kv in fs.inotify.max_user_instances=512 fs.inotify.max_user_watches=524288; do
            key=${kv%=*}; min=${kv#*=}
            cur=$(sysctl -n "$key")
            if [ "$cur" -ge "$min" ]; then ok "$key: $cur"; else ng "$key: $cur (>= $min required)" "sudo sysctl -w $key=$min"; fi
          done

          # 6. kernel >= 5.10
          kver=$(uname -r)
          major=${kver%%.*}; rest=${kver#*.}; minor=${rest%%.*}
          if [ "$major" -gt 5 ] || { [ "$major" -eq 5 ] && [ "$minor" -ge 10 ]; }; then
            ok "kernel: $kver"
          else
            ng "kernel: $kver (>= 5.10 required)" "upgrade the kernel"
          fi

          # 7. sudo
          if command -v sudo >/dev/null; then ok "sudo: available"; else ng "sudo: not found" "install sudo"; fi

          # 8. tools
          missing=""
          for c in {{.HOST_COMMANDS}}{{range $pkg, $cmds := .AQUA_COMMANDS}} {{$cmds}}{{end}}; do
            command -v "$c" >/dev/null || missing="$missing $c"
          done
          if [ -z "$missing" ]; then ok "tools: all found"; else ng "tools: missing:$missing" "run 'task setup' (docker, curl and go come from the host)"; fi

          exit $fail

  lint:
    desc: Run all static checks (docs/testing.md 4.1)
    silent: true
    cmds:
      - cmd: |
          rc=0
          for t in lint:yaml lint:tools lint:actions lint:go lint:testids lint:frr lint:iptables lint:helm lint:kubeconform lint:links lint:diagrams; do
            echo "==> $t"
            {{.TASK_EXE}} "$t" || { echo "FAILED: $t"; rc=1; }
          done
          exit $rc

  lint:yaml:
    cmds:
      - uvx yamllint@{{.YAMLLINT_VERSION}} -s .

  lint:tools:
    cmds:
      # The packages in aqua.yaml and the keys of AQUA_COMMANDS must match.
      - cmd: |
          diff -u \
            --label aqua.yaml <(yq '.packages[].name | sub("@.*$", "")' aqua.yaml | sort) \
            --label AQUA_COMMANDS <(printf '%s\n' {{range $pkg, $cmds := .AQUA_COMMANDS}}{{$pkg}} {{end}} | sort)

  lint:actions:
    vars:
      WORKFLOW: ../../.github/workflows/kindcluster-mcs-gateway.yml
    cmds:
      - actionlint {{.WORKFLOW}}
      # Offline check: every `uses:` must be pinned to a full-length SHA with a version comment.
      - pinact run --fix=false --no-api {{.WORKFLOW}}

  lint:go:
    dir: e2e
    cmds:
      - cmd: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - go vet ./...
      - MCSGW_E2E=1 go test -list '.*' ./...

  lint:testids:
    # Test IDs in the docs and t.Run("<ID>" in e2e must match, for labels that have a test file.
    cmds:
      - cmd: |
          set -euo pipefail
          rc=0
          for f in e2e/*_test.go; do
            case "$(basename "$f")" in main_test.go|helpers_test.go) continue ;; esac
            label=$(basename "$f" _test.go | tr _ -)
            exclude='^({{.REPRO_TEST_IDS | replace " " "|"}})$'
            doc=$(grep -ohE "^\| $label-[0-9]+ \|" docs/*.md | grep -oE "$label-[0-9]+" | grep -vE "$exclude" | sort -u || true)
            code=$(grep -ohE "t\.Run\(\"$label-[0-9]+\"" e2e/*_test.go | grep -oE "$label-[0-9]+" | sort -u || true)
            diff -u --label "docs ($label)" <(echo "$doc") --label "e2e ($label)" <(echo "$code") || rc=1
          done
          exit $rc

  lint:frr:
    # Syntax check of the FRR configs with the image used in topology.clab.yaml.
    vars:
      FRR_IMAGE:
        sh: yq '.topology.nodes.spine0.image' topology.clab.yaml
      FRR_CONFS:
        sh: ls frr/*.conf | grep -v '/vtysh.conf$'
    cmds:
      - for: {var: FRR_CONFS}
        cmd: >-
          docker run --rm --entrypoint vtysh
          -v "$PWD/frr/vtysh.conf:/etc/frr/vtysh.conf:ro"
          -v "$PWD/{{.ITEM}}:/tmp/frr.conf:ro"
          {{.FRR_IMAGE}} --dryrun -f /tmp/frr.conf

  lint:iptables:
    # Syntax check of the spine0 ACL with the image of nat-spine0 (docs/network.md 2.9).
    vars:
      NETSHOOT_IMAGE:
        sh: yq '.topology.nodes.nat-spine0.image' topology.clab.yaml
    cmds:
      - >-
        docker run --rm --cap-add NET_ADMIN
        -v "$PWD/iptables/spine0.rules:/tmp/spine0.rules:ro"
        {{.NETSHOOT_IMAGE}} iptables-restore --test /tmp/spine0.rules

  lint:helm:
    # Render the Cilium chart, and fail on values keys the chart does not have (docs/cilium.md 2.2).
    # The chart silently ignores unknown keys; keys under a map whose default is {} are free-form.
    # A key is known if it is in the default values or the templates read it as .Values.<key>
    # (some keys, such as loadBalancer.mode, are commented out in the default values).
    silent: true
    cmds:
      - cmd: |
          set -euo pipefail
          defaults=$(helm show values {{.CILIUM_CHART}} | yq -o json)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          helm pull {{.CILIUM_CHART}} --untar --untardir "$tmp"
          referenced=$(grep -rhoE '\.Values(\.[A-Za-z0-9_]+)+' "$tmp"/cilium/templates | sed 's/^\.Values\.//' | sort -u | jq -R . | jq -s .)
          rc=0
          for c in {{.CLUSTERS}}; do
            helm template cilium {{.CILIUM_CHART}} -n kube-system \
              -f cilium/values/common.yaml -f cilium/values/$c.yaml >/dev/null || { echo "helm template failed: $c"; rc=1; }
          done
          for f in cilium/values/*.yaml; do
            unknown=$(yq -o json '[.. | select(tag != "!!map" or length == 0) | path]' "$f" | jq -r --argjson d "$defaults" --argjson refs "$referenced" '
              def known($o; $p):
                ($p | length) == 0
                or (($o | type) == "object" and ($o | has($p[0]))
                    and (($o[$p[0]] | type == "object" and length == 0) or known($o[$p[0]]; $p[1:])));
              .[] | select(known($d; .) | not) | map(tostring) | join(".")
                  | select(. as $k | $refs | index($k) | not)')
            if [ -n "$unknown" ]; then echo "$f: keys not in the chart values:"; echo "$unknown"; rc=1; fi
          done
          exit $rc

  lint:kubeconform:
    # Validate manifests with schemas built from the pinned CRDs (docs/testing.md 4.1).
    silent: true
    cmds:
      - cmd: |
          set -euo pipefail
          # Write one schema per CRD version: <kind>_<version>.json. A file may hold several CRDs.
          # kubeconform -strict does not reach nested objects; deny unknown fields in the schema
          # itself, as openapi2jsonschema does in strict mode.
          schemas() {
            local docs n i y kind v
            docs=$(cat)
            n=$(echo "$docs" | yq ea '[select(.kind == "CustomResourceDefinition")] | length')
            for i in $(seq 0 $((n - 1))); do
              y=$(echo "$docs" | yq ea "[select(.kind == \"CustomResourceDefinition\")] | .[$i]")
              kind=$(echo "$y" | yq '.spec.names.kind | downcase')
              for v in $(echo "$y" | yq '.spec.versions[].name'); do
                echo "$y" | yq -o json ".spec.versions[] | select(.name == \"$v\") | .schema.openAPIV3Schema" |
                  jq 'walk(if type == "object" and has("properties") and (has("additionalProperties") | not)
                             and (has("x-kubernetes-preserve-unknown-fields") | not)
                           then .additionalProperties = false else . end)' > "$1/${kind}_$v.json"
              done
            done
          }
          cilium={{.KUBECONFORM_CACHE}}/cilium-{{.CILIUM_VERSION}}
          mkdir -p "$cilium"
          for crd in {{.CILIUM_CRDS}}; do
            curl -fsSL https://raw.githubusercontent.com/cilium/cilium/v{{.CILIUM_VERSION}}/pkg/k8s/apis/cilium.io/client/crds/$crd | schemas "$cilium"
          done
          eg={{.KUBECONFORM_CACHE}}/envoy-gateway-{{.ENVOY_GATEWAY_VERSION}}
          mkdir -p "$eg"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          helm pull {{.ENVOY_GATEWAY_CHART}} --version {{.ENVOY_GATEWAY_VERSION}} --untar --untardir "$tmp" 2>/dev/null
          for crd in {{.ENVOY_GATEWAY_CRDS}}; do
            schemas "$eg" < "$tmp/gateway-helm/charts/crds/crds/$crd"
          done
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location "$cilium/{{"{{"}}.ResourceKind{{"}}"}}_{{"{{"}}.ResourceAPIVersion{{"}}"}}.json" \
            -schema-location "$eg/{{"{{"}}.ResourceKind{{"}}"}}_{{"{{"}}.ResourceAPIVersion{{"}}"}}.json" \
            cilium/ipam cilium/bgp cilium/lbipam coredns envoy-gateway sample

  lint:links:
    cmds:
      - lychee --offline --no-progress 'docs/**/*.md'

  lint:diagrams:
    cmds:
      - task: docs
      - cmd: |
          rc=0
          for svg in docs/images/*.svg; do
            name=$(basename "$svg" .svg)
            [ -f "docs/diagrams/$name.d2" ] || { echo "orphan SVG: $svg"; rc=1; }
          done
          changed=$(git status --porcelain docs/images)
          if [ -n "$changed" ]; then
            echo "docs/images is out of date; run 'task docs' and commit the result:"
            echo "$changed"
            rc=1
          fi
          exit $rc

  docs:
    desc: Render docs/diagrams/*.d2 to docs/images/*.svg
    cmds:
      - for: {var: D2_FILES}
        cmd: d2 {{.D2_FLAGS}} {{.ITEM}} docs/images/{{base .ITEM | trimSuffix ".d2"}}.svg
    vars:
      D2_FILES:
        sh: ls docs/diagrams/*.d2

  test:
    desc: Run e2e tests. LABEL=<label> or ID=<test id> narrows them (docs/testing.md 3.6)
    dir: e2e
    vars:
      SEL_LABEL: '{{if .ID}}{{regexReplaceAll "-[0-9]+$" .ID ""}}{{else}}{{.LABEL}}{{end}}'
      SEL_FUNC: '{{if .SEL_LABEL}}{{get .TEST_FUNCS .SEL_LABEL}}{{end}}'
      RUN: '{{if .ID}}^{{.SEL_FUNC}}$/^{{.ID}}${{else if .SEL_FUNC}}^{{.SEL_FUNC}}${{end}}'
    preconditions:
      - sh: '[ -z "{{.SEL_LABEL}}" ] || [ -n "{{.SEL_FUNC}}" ]'
        msg: "unknown label '{{.SEL_LABEL}}' (labels: {{keys .TEST_FUNCS | sortAlpha | join \", \"}})"
    cmds:
      # Fail when nothing ran (e.g. a mistyped ID) instead of passing silently.
      - cmd: |
          set -o pipefail
          out=$(mktemp)
          trap 'rm -f "$out"' EXIT
          MCSGW_E2E=1 go test -count=1 -v -timeout 60m {{if .RUN}}-run '{{.RUN}}'{{end}} ./... 2>&1 | tee "$out"
          if grep -q 'no tests to run' "$out"; then echo "no tests ran"; exit 1; fi

  start:
    desc: Build the lab (docs/operations.md 4)
    cmds:
      - task: check-host
      - task: deploy-fabric
      - task: deploy-cilium
      - task: deploy-coredns
      - task: deploy-bgp
      - task: deploy-sample
      - task: deploy-gateway

  deploy-fabric:
    desc: containerlab, kind, FRR and the host link (docs/network.md 2.7)
    silent: true
    cmds:
      - cmd: |
          set -euo pipefail
          want_clab=$(yq '[.topology.nodes[] | select(.kind == "linux")] | length' topology.clab.yaml)
          want_kind=$(yq '[.topology.nodes[] | select(.kind == "ext-container")] | length' topology.clab.yaml)
          count() { docker ps -a -q "$@" | wc -l; }
          running() { docker ps -q "$@" | wc -l; }
          # docker ANDs repeated label filters, so count each cluster separately.
          kind_nodes() { n=0; for c in {{.CLUSTERS}}; do n=$((n + $("$1" --filter label=io.x-k8s.kind.cluster=$c))); done; echo $n; }
          n_clab=$(running --filter label=containerlab=mcsgw)
          n_kind=$(kind_nodes running)
          all_clab=$(count --filter label=containerlab=mcsgw)
          all_kind=$(kind_nodes count)
          if [ "$n_clab" -eq "$want_clab" ] && [ "$n_kind" -eq "$want_kind" ]; then
            echo "lab mcsgw is running; skip containerlab deploy"
          elif [ "$all_clab" -eq 0 ] && [ "$all_kind" -eq 0 ]; then
            if [ ! -t 0 ]; then
              echo "containerlab deploy needs sudo; run 'task deploy-fabric' in a terminal (docs/operations.md 6)" >&2
              exit 1
            fi
            {{.CLAB}} deploy -t topology.clab.yaml
          else
            echo "lab mcsgw is partially up (clab $n_clab/$want_clab, kind $n_kind/$want_kind running); run 'task stop' first" >&2
            exit 1
          fi
        interactive: true
      # The host address and routes are set by the host-mcsgw node (docs/network.md 2.5); only read them here.
      - cmd: |
          set -euo pipefail
          ng() { echo "host link is not ready: $1; run 'task stop' and deploy again" >&2; exit 1; }
          ip -4 -o addr show dev to-mcsgw 2>/dev/null | grep -q ' 172.30.0.1/30 ' || ng "172.30.0.1/30 on to-mcsgw"
          for r in 10.69.0.0/16 10.80.0.0/14; do
            ip -4 route show "$r" | grep -q 'via 172.30.0.2 dev to-mcsgw' || ng "route $r"
          done
      - for: {var: CLUSTERS, split: " "}
        cmd: kind export kubeconfig --name {{.ITEM}}

  deploy-cilium:
    desc: Cilium and the Pod IP pools (docs/cilium.md 2.1)
    cmds:
      - for: {var: CLUSTERS, split: " "}
        cmd: |
          set -euo pipefail
          ctx=kind-{{.ITEM}}
          helm upgrade --install cilium {{.CILIUM_CHART}} --kube-context $ctx -n kube-system \
            -f cilium/values/common.yaml -f cilium/values/{{.ITEM}}.yaml
          # The operator creates the CRDs; the agents are not ready until the pool exists.
          for i in $(seq 120); do kubectl --context $ctx get crd ciliumpodippools.cilium.io >/dev/null 2>&1 && break; sleep 2; done
          kubectl --context $ctx wait --for condition=established --timeout 60s crd/ciliumpodippools.cilium.io
          kubectl --context $ctx apply -f cilium/ipam/{{.ITEM}}.yaml
      - for: {var: CLUSTERS, split: " "}
        cmd: |
          set -euo pipefail
          cilium status --wait --wait-duration 10m --context kind-{{.ITEM}} >/dev/null
          kubectl --context kind-{{.ITEM}} wait --for condition=Ready --timeout 10m nodes --all

  deploy-coredns:
    desc: CoreDNS forwarding to dns0 (docs/cilium.md 2.4)
    cmds:
      # The reload plugin would pick up the change only after the kubelet syncs the volume (a minute
      # or more). Roll the Pods on a Corefile change instead, so the new upstream is in effect when
      # this task returns. The same hash patches nothing, so a second run does not restart CoreDNS.
      - for: {var: CLUSTERS, split: " "}
        cmd: |
          set -euo pipefail
          ctx=kind-{{.ITEM}}
          kubectl --context $ctx apply --server-side --force-conflicts --field-manager mcsgw -f coredns/configmap.yaml
          sum=$(sha256sum coredns/configmap.yaml | cut -c1-16)
          kubectl --context $ctx -n kube-system patch deployment coredns \
            -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"mcsgw/corefile-sha256\":\"$sum\"}}}}}"
          kubectl --context $ctx -n kube-system rollout status deployment coredns --timeout 5m

  deploy-bgp:
    desc: BGP and LB IPAM resources (docs/cilium.md 4.3)
    vars:
      CRDS: >-
        ciliumbgpclusterconfigs.cilium.io
        ciliumbgppeerconfigs.cilium.io
        ciliumbgpadvertisements.cilium.io
        ciliumloadbalancerippools.cilium.io
    cmds:
      # The operator creates the CRDs at startup; they may not exist right after deploy-cilium.
      # Sessions and routes are not waited for; the tests wait for them.
      - for: {var: CLUSTERS, split: " "}
        cmd: |
          set -euo pipefail
          ctx=kind-{{.ITEM}}
          for crd in {{.CRDS}}; do
            for i in $(seq 120); do kubectl --context $ctx get crd $crd >/dev/null 2>&1 && break; sleep 2; done
            kubectl --context $ctx wait --for condition=established --timeout 60s crd/$crd
          done
          kubectl --context $ctx apply -f cilium/bgp/common.yaml -f cilium/bgp/{{.ITEM}}.yaml -f cilium/lbipam/{{.ITEM}}.yaml

  deploy-sample:
    desc: The sample app demo/echo (docs/envoy-gateway.md 2.4)
    cmds:
      # edge only until PR 07 adds core1 and core2 (docs/mcs.md).
      - cmd: |
          set -euo pipefail
          kubectl --context kind-edge apply -f sample/echo.yaml
          kubectl --context kind-edge -n demo rollout status deployment echo --timeout 5m

  deploy-gateway:
    desc: Envoy Gateway, the Gateway and the HTTPRoutes on edge (docs/envoy-gateway.md 2.2)
    cmds:
      - cmd: |
          set -euo pipefail
          ctx=kind-edge
          # The chart installs the Gateway API and Envoy Gateway CRDs; --wait waits for the controller.
          helm upgrade --install eg {{.ENVOY_GATEWAY_CHART}} --version {{.ENVOY_GATEWAY_VERSION}} \
            --kube-context $ctx -n envoy-gateway-system --create-namespace --wait --timeout 10m
          kubectl --context $ctx apply -f envoy-gateway/
          kubectl --context $ctx -n demo wait --for condition=Programmed --timeout 5m gateway/gw

  stop:
    desc: Destroy the lab and check that nothing is left (docs/operations.md 5)
    silent: true
    cmds:
      - cmd: |
          set -euo pipefail
          # docker ANDs repeated label filters, so count each cluster separately.
          left=$(docker ps -a -q --filter label=containerlab=mcsgw | wc -l)
          for c in {{.CLUSTERS}}; do left=$((left + $(docker ps -a -q --filter label=io.x-k8s.kind.cluster=$c | wc -l))); done
          if [ "$left" -eq 0 ] && [ ! -d clab-mcsgw ] && ! ip link show to-mcsgw >/dev/null 2>&1; then
            echo "lab mcsgw is not running; skip containerlab destroy"
            exit 0
          fi
          if [ ! -t 0 ]; then
            echo "containerlab destroy needs sudo; run 'task stop' in a terminal (docs/operations.md 6)" >&2
            exit 1
          fi
          {{.CLAB}} destroy -t topology.clab.yaml --cleanup
        interactive: true
      - for: {var: CLUSTERS, split: " "}
        cmd: |
          kubectl config delete-context kind-{{.ITEM}} >/dev/null 2>&1 || true
          kubectl config delete-cluster kind-{{.ITEM}} >/dev/null 2>&1 || true
          kubectl config delete-user kind-{{.ITEM}} >/dev/null 2>&1 || true
      - cmd: |
          rc=0
          ng() { echo "left over: $1"; rc=1; }
          [ -z "$(docker ps -a -q --filter label=containerlab=mcsgw)" ] || ng "clab-mcsgw-* containers"
          for c in {{.CLUSTERS}}; do
            [ -z "$(docker ps -a -q --filter label=io.x-k8s.kind.cluster=$c)" ] || ng "kind nodes of $c"
            ! kubectl config get-contexts -o name | grep -qx "kind-$c" || ng "kube context kind-$c"
          done
          ! ip link show to-mcsgw >/dev/null 2>&1 || ng "link to-mcsgw"
          for r in 10.69.0.0/16 10.80.0.0/14; do
            [ -z "$(ip -4 route show "$r")" ] || ng "route $r"
          done
          [ ! -e clab-mcsgw ] || ng "directory clab-mcsgw/"
          [ "$rc" -eq 0 ] && echo "lab mcsgw is stopped; nothing is left"
          exit $rc

  status:
    desc: Show the topology, BGP and clusters (read only)
    cmds:
      - cmd: docker ps -a --filter label=containerlab=mcsgw --format 'table {{"{{"}}.Names{{"}}"}}\t{{"{{"}}.Status{{"}}"}}'
      - cmd: docker exec clab-mcsgw-spine0 vtysh -c 'show bgp summary'
        ignore_error: true
      - for: {var: CLUSTERS, split: " "}
        cmd: kubectl --context kind-{{.ITEM}} get nodes -o wide
        ignore_error: true
